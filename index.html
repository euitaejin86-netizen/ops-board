<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해외파견 결정 대시보드</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--card2:#202a40;--txt:#e8edf6;--sub:#8fa0bf;--acc:#4da3ff;--ok:#2fd58a;--warn:#ffb347;--bad:#ff6b6b;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Segoe UI','Malgun Gothic',sans-serif;padding:20px}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--sub);font-size:13px;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:14px}
.card{background:var(--card);border-radius:12px;padding:16px;border:1px solid #2a3650}
.card h3{font-size:14px;color:var(--acc);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
.b-warn{background:#3d2f14;color:var(--warn)}
.b-ok{background:#123524;color:var(--ok)}
.b-bad{background:#3d1616;color:var(--bad)}
.b-info{background:#12243d;color:var(--acc)}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #25304a;font-size:13px}
.row:last-child{border-bottom:none}
.row b{color:var(--txt)}
.row span{color:var(--sub)}
.num{font-size:24px;font-weight:700;color:var(--acc)}
.bar{height:10px;background:#25304a;border-radius:6px;overflow:hidden;margin-top:6px}
.bar>div{height:100%;border-radius:6px}
.ta{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.7;white-space:pre-wrap}
.tl{font-size:12.5px;color:var(--txt);line-height:1.8}
.tl b{color:var(--acc)}
.chk{list-style:none}
.chk li{padding:5px 0;font-size:13px;border-bottom:1px dashed #25304a}
.chk li:before{content:"☐ ";color:var(--warn)}
.chk li.done:before{content:"☑ ";color:var(--ok)}
.chk li.done{color:var(--sub);text-decoration:line-through}
.footer{color:var(--sub);font-size:11px;margin-top:16px;text-align:center}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>✈️ 해외파견 결정 대시보드</h1>
<div class="sub" id="subline">로딩 중...</div>

<div class="grid" id="g-status"></div>
<div class="grid" id="g-main"></div>
<div class="grid" id="g-docs"></div>
<div class="footer" id="footer"></div>

<script>
let DATA = null;

function esc(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function doc(label){
  if(!DATA) return null;
  return DATA.docs.find(d=>d.exists && d.label===label) || null;
}
function bodyOf(label){
  const d = doc(label);
  return d ? d.body : '';
}
function card(title, inner, cls){
  return `<div class="card"><h3>${title}</h3>${inner}</div>`;
}
function statRow(k,v){ return `<div class="row"><span>${k}</span><b>${v}</b></div>`; }

/* ---- 재무에서 숫자 추출: 마크다운 테이블 줄 단위 파싱 ---- */
function tableValue(text, label){
  if(!text) return '—';
  // 라벨이 들어간 테이블 행을 찾아서 두 번째|세 번째 셀에서 숫자 추출
  for(const line of text.split('\n')){
    if(line.includes('|') && line.includes(label)){
      const cells = line.split('|').map(c=>c.replace(/\*/g,'').trim());
      // 셀 중 숫자(콤마/± 포함)를 가진 것 찾기
      for(const c of cells.slice(1)){
        const m = c.replace(/,/g,'').match(/-?\d+/);
        if(m) return m[0];
      }
    }
  }
  return '—';
}

function build(){
  if(!DATA){ document.getElementById('subline').textContent='데이터 로드 실패'; return; }
  const master = doc('마스터');
  const mb = master ? master.body : '';
  const fin = doc('월간수입지출표');
  const fb = fin ? fin.body : '';
  const scs = doc('시카고 심화');
  const sb = scs ? scs.body : '';

  // 상태 카드
  let status = '';
  const hasConfirm = /최종 확정|확정함/.test(mb);
  const badge = hasConfirm ? '<span class="badge b-ok">결정됨</span>' : '<span class="badge b-warn">⏳ 검토 중 (미확정)</span>';
  status = card('🧭 결정 상태', badge + '<div class="ta" style="margin-top:8px">' + esc(mb.split('## 1.')[0].slice(0,400)) + '</div>');

  // 재무 요약 (라벨: 수입 합계 / 총지출 / 월 잉여)
  const income = tableValue(fb, '수입 합계');
  const spend = tableValue(fb, '총지출');
  const surp = tableValue(fb, '월 잉여');
  const incomeN = parseInt((income||'0').replace(/,/g,'')||'0');
  const spendN = parseInt((spend||'0').replace(/,/g,'')||'0');
  const pct = incomeN>0 ? Math.min(100, Math.round(spendN/incomeN*100)) : 0;
  let finCard = card('💰 재무 (4급·사택·세후)', 
    statRow('월 수입', (income==='—'?'—':income+' 원')) +
    statRow('월 지출', (spend==='—'?'—':spend+' 원')) +
    statRow('월 잉여', (surp==='—'?'—':surp+' 원')) +
    '<div style="margin-top:8px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub)"><span>지출/수입 비율</span><span>'+pct+'%</span></div><div class="bar"><div style="width:'+pct+'%;background:'+(pct>100?'var(--bad)':'var(--acc)')+'"></div></div></div>' +
    '<div class="ta">SCS 학비(초3) ₩297만/월 전액자비 · 공립 전환 시 +290만 흑자</div>');

  // SCS 카드
  let scsCard = card('🏫 SCS (샴버그 기독교)',
    statRow('종교계열', '침례교 (Bethel)') +
    statRow('재학생', '850명 · 30+국가') +
    statRow('통학 GBC↔SCS', '5.4km / 약7분') +
    statRow('학비 K-5', '$8,920/년') +
    statRow('입학', 'I-20/F-1 수용') +
    '<div class="ta">' + esc(sb.split('## 3.')[0].slice(-500)) + '</div>');

  // SCS 메일 상태
  const mail = doc('SCS 메일');
  let mailCard = card('📧 SCS 입학문의 메일',
    statRow('발신', 'uietae@gmail.com') +
    statRow('수신', 'Karen Bustamante') +
    statRow('발송일', '2026-08-24') +
    '<span class="badge b-warn" style="margin-top:8px">답변 대기 중</span>' +
    '<div class="ta">문의: ESL 유무 · I-20/F-1 · 좌석 · 학비할인 · 캠퍼스 · 장학금</div>');

  // 후보 3곳
  let cand = '';
  const cands = [
    ['🥇 시카고', '유력 1순위', 'b-ok'],
    ['🥈 방콕', '차순위', 'b-info'],
    ['🥉 알마티', '3순위', 'b-info'],
  ];
  cand = card('🗺️ 후보 (미확정)', cands.map(c=>`<div class="row"><span>${c[0]}</span><span class="badge ${c[2]}">${c[1]}</span></div>`).join('') +
    '<div class="ta">두바이 = 배제(경쟁 최고). 방콕/알마티 = 비영어권 학자금 혜택.</div>');

  // 다음 액션 체크리스트
  let todo = '';
  const todos = [
    ['SCS 답변 수신 (ESL 유무 확인)', true],
    ['아내 의향 확인', false],
    ['회사 공모 일정·경쟁률 확인', false],
    ['방콕/알마티 최종 비교', false],
    ['TOEIC 780 / TEPS 310 준비', false],
  ];
  todo = card('📋 다음 액션', '<ul class="chk">' + todos.map(t=>`<li${t[1]?' class="done"':''}>${t[0]}</li>`).join('') + '</ul>');

  document.getElementById('g-status').innerHTML = status;
  document.getElementById('g-main').innerHTML = finCard + scsCard + mailCard + cand + todo;

  // 문서 카드들
  let docsHtml = '';
  DATA.docs.filter(d=>d.exists).forEach(d=>{
    docsHtml += `<div class="card"><h3>📄 ${esc(d.label)}</h3>` +
      `<div class="row"><span>상태</span><b>${esc(d.status||'-')}</b></div>` +
      `<div class="row"><span>최근 갱신</span><b>${esc(d.updated||'-')}</b></div>` +
      `<div class="ta">${esc(d.title)}</div></div>`;
  });
  document.getElementById('g-docs').innerHTML = docsHtml;

  document.getElementById('subline').innerHTML =
    `데이터 소스: Obsidian wiki (${DATA.docs.filter(d=>d.exists).length}개 문서) · 마스터: <b>검토 중</b>`;
  document.getElementById('footer').textContent = '마지막 동기화: ' + DATA.generated_at + ' · 30초마다 자동 갱신';
}

async function load(){
  try{
    const r = await fetch('overseas_data.json?t='+Date.now(), {cache:'no-store'});
    DATA = await r.json();
    build();
  }catch(e){
    document.getElementById('subline').textContent = '데이터 로드 실패: ' + e.message;
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
